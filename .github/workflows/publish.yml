name: Publication Instagram (9h et 18h)
on:
  schedule:
    # Secours : le déclenchement à l'heure vient des tâches programmées Claude (9h02 et 18h02).
    - cron: "4 7 * * *"   # 9h à Paris en été
    - cron: "4 8 * * *"   # 9h à Paris en hiver (le script ignore le passage trop tôt et ne publie jamais deux fois)
    - cron: "4 16 * * *"  # 18h à Paris en été
    - cron: "4 17 * * *"  # 18h à Paris en hiver
  workflow_dispatch:
    inputs:
      date: { description: "Date à publier (AAAA-MM-JJ), vide = aujourd'hui", required: false }
      slot: { description: "Créneau : matin, soir, ou vide = les deux", required: false }
permissions:
  contents: write
concurrency: { group: publish, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Publier les posts validés du jour
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          SLOT=""
          if [ -n "${{ github.event.inputs.slot }}" ]; then SLOT="--slot ${{ github.event.inputs.slot }}"; fi
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python scripts/publish_daily.py --force --date "${{ github.event.inputs.date }}" $SLOT
          else
            python scripts/publish_daily.py
          fi
      - name: Enregistrer le statut « publié »
        if: always()   # même si un créneau a échoué : ne jamais perdre le statut d'un post déjà publié
        run: |
          if [ -n "$(git status --porcelain posts)" ]; then
            git config user.name "statdefrance-bot"
            git config user.email "statdefrance-bot@users.noreply.github.com"
            git add posts && git commit -qm "Publié : $(date +%F)"
            # le repo a pu bouger pendant la publication (validations, autre robot) : on récupère puis on pousse
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          fi
