name: Publication Reel
on:
  push:
    branches: [main]
    paths: ["reels/*.json"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: publish, cancel-in-progress: false }
jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Publier les Reels validés
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/publish_reel.py
      - name: Enregistrer le statut « publié »
        run: |
          if [ -n "$(git status --porcelain reels)" ]; then
            git config user.name "statdefrance-bot"
            git config user.email "statdefrance-bot@users.noreply.github.com"
            git add reels && git commit -qm "Reel publié" && git pull -q --rebase && git push
          fi
