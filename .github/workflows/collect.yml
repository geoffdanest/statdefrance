name: Collecte hebdo (data.gouv + Insee + actu)
on:
  schedule:
    - cron: "7 15 * * 0"   # dimanche ~17h (été) / ~16h (hiver) à Paris, avant la génération de 18h
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_candidates.py
      - name: Publier sur la branche « candidates » (écrasée chaque semaine, sans historique)
        run: |
          git config user.name "statdefrance-bot"
          git config user.email "statdefrance-bot@users.noreply.github.com"
          cd candidates
          git init -q -b candidates
          git add -A
          git -c user.name="statdefrance-bot" -c user.email="statdefrance-bot@users.noreply.github.com" commit -qm "Collecte du $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" candidates
